[package]
name = "kaijulab"
version = "0.1.0"
edition = "2021"
description = "KaijuLab — LLM-native Reverse Engineering Lab"

[[bin]]
name = "kaijulab"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (rustls so no OpenSSL dep).  Used by virustotal_check.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Async streams
futures-util = "0.3"

# Binary analysis
object = "0.36"
goblin = "0.8"
iced-x86 = "1"

# Decompiler (ported from Ouroboros, MIT/Apache-2.0)
sleigh-runtime = { git = "https://github.com/icicle-emu/icicle-emu" }
sleigh-compile = { git = "https://github.com/icicle-emu/icicle-emu" }
pcode = { git = "https://github.com/icicle-emu/icicle-emu" }
nodit = "0.9"
smallvec = "1"
petgraph = "0.8"
enumset = "1"

# Timestamps for project notes
chrono = "0.4"

# Async trait objects (required for the McpBackend trait in src/mcp/server.rs)
async-trait = "0.1"

# Error handling
anyhow = "1"

# DWARF debug-info parsing
gimli = "0.31"

# Persistent project database
rusqlite = { version = "0.31", features = ["bundled"] }

# Windows PDB symbol loading
pdb = "0.8"

# Multi-architecture disassembler (ARM64, ARM, MIPS, …)
capstone = "0.12"

# Configuration file (~/.kaiju/config.toml)
toml = "0.8"

# Scripting / plugin engine (Rhai — pure Rust, embeds cleanly)
rhai = { version = "1", features = ["sync"] }

# Temp files (for run_python tool)
tempfile = "3"

# POSIX process group control (run_python isolation)
libc = "0.2"

# ── Web / MCP stack ───────────────────────────────────────────────────────────

# HTTP server
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower = "0.4"

# Embed web/dist into the binary in release builds
include_dir = "0.7"

# UUIDs for job/finding/event IDs
uuid = { version = "1", features = ["v4", "serde"] }

# TypeScript bindings generator (for Rust ↔ web shared types)
ts-rs = { version = "10" }

# Concurrent maps for in-memory caches
dashmap = "6"

# Path-based hashing (workspace identifier for sockets)
sha2 = "0.10"
hex = "0.4"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
